# 产出台：右侧栏「产出台」tab 的 Host 半部（扫描 + /api 路由）。
# 浏览器半部由 package.json 的 dsh.client 清单发现，并通过 ./client 导出。
#
# ⚠️ 顶层必须是「数组」，首项是 - insert:。写成对象（insert: 直接顶格）会导致 patch 无法加载，
# 整个插件在面板里消失。
#
# 产出根目录（root）刻意不在这里写死，插件会按下面的顺序自动选：
#   1. 运行时设置文件 <DSH_HOME>/dsh-gallery.json 里的 root（面板内可直接改，改完立即生效）
#   2. 本文件里显式配置的 root（想给整个团队统一指定时再填）
#   3. 自动探测：~/DSH产出 → ~/Documents/DSH产出 → ~/Desktop/DSH产出 → ~/Downloads/DSH产出
#
# 想显式指定就把 root 那行取消注释并改成你的目录（Windows 反斜杠要双写或改用正斜杠）：
#   root: 'D:/产出'
- insert:
    - id: dsh-gallery
      name: 'dsh-gallery'
      config:
        # root 留空 → 走自动探测 / 运行时设置
        #
        # ⚠️ windowHours 不要在这里写死！
        # 它是「扫描多久以内的文件」。写死 24 会让「全局按对话分组」只剩当天产出，
        # 历史对话全部看不到（这正是 v0.8.0 分组只显示 2 组的原因）。
        # 代码里的默认值是一整年；想覆盖请改 <DSH_HOME>/dsh-gallery.json 里的 windowHours。
        maxItems: 60
        maxDepth: 3
        extensions:
          - .png
          - .jpg
          - .jpeg
          - .webp
        skipDirs:
          - library_merged
          - node_modules
          - .git
          - .svn
          - $RECYCLE.BIN
          - System Volume Information
          - __pycache__
          - .venv
          - venv
          - .cache
